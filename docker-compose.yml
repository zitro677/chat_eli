# Agente ELI — producción en VPS: app + PostgreSQL
services:
  agent:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"   # solo local; el proxy HTTPS (Caddy/Nginx) expone el puerto
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://elim:${POSTGRES_PASSWORD}@db:5432/elim
      ENVIRONMENT: production
    volumes:
      - ./knowledge:/app/knowledge
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: elim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elim"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
